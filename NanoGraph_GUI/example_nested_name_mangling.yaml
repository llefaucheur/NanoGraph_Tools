# Example of names produced when arm_filter_cascade_1 is inserted inside
# arm_filter_cascade_0. Boundary nodes are not emitted.

nodes:
  - node: arm_filter_cascade_0__arm_filter_0
  - node: arm_filter_cascade_0__arm_filter_1
  - node: arm_filter_cascade_0__arm_filter_cascade_1__arm_filter_0
  - node: arm_filter_cascade_0__arm_filter_cascade_1__arm_filter_1

# Internal arcs of both reusable subgraphs are retained. Parent-to-child arcs
# are added according to the actual connections made in the subgraph editor.
arcs:
  - OPort_0 node: arm_filter_cascade_0__arm_filter_0
    IPort_0 node: arm_filter_cascade_0__arm_filter_1
    buffer_size: 16
  - OPort_0 node: arm_filter_cascade_0__arm_filter_cascade_1__arm_filter_0
    IPort_0 node: arm_filter_cascade_0__arm_filter_cascade_1__arm_filter_1
    buffer_size: 16
