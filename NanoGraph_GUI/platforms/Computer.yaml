platform: Computer
version: 1
description: Desktop computer test platform (Windows, macOS or Linux).

#------------------------------------------
file_paths:
  - path_to: node_manifest_arm
    index: 0        # this avoids modifying all the paths in processors/../node:
    path: ../manifests
  - path_to: node_manifest_sigp
    index: 1
    path: ../manifests
    
#------------------------------------------
processors:
  - processor:
    archID: armv7m
    procID: 0
    nodes:          # list of nodes 

      - node: 
        path: 0
        index: 1
        name: arm_script
      - node: 
        path: 0
        index: 2
        name: arm_filter
      - node: 
        path: 0
        index: 3
        name: arm_converter    
      - node: 
        path: 0
        index: 4
        name: bb_jpegenc
      - node: 
        path: 0
        index: 5
        name: eml_tjpgdec
      - node: 
        path: 0
        index: 6
        name: sigp_amplifier
      - node: 
        path: 0
        index: 7
        name: sigp_modulator
      - node: 
        path: 0
        index: 8
        name: sigp_demodulator
      - node: 
        path: 0
        index: 9
        name: sigp_filter2D
      - node: 
        path: 0
        index: 10
        name: sigp_detector
      - node: 
        path: 0
        index: 11
        name: sigp_detector2D
      - node: 
        path: 0
        index: 12
        name: sigp_resampler
      - node: 
        path: 0
        index: 13
        name: sigp_compressor
      - node: 
        path: 0
        index: 14
        name: sigp_decompressor
      - node: 
        path: 0
        index: 15
        name: sigp_router    
        

  - processor:
    archID: armv7m
    procID: 0
    nodes:          # list of nodes 
      - node: 
        path: 0
        index: 2
        name: sigp_filter2D

#------------------------------------------
memories:
  - memory: shared  # default 
    index: 0
    size: 8000      # bytes guaranteed for the compiler allocations
    access: 0       # 0 data/prog R/W, 1 data R/W, 2 Prog, 3 Copro
    speed: 0        # 0 slow/best effort, 1 fast/internal, 2 TCM
    type: 0         # 0 Static, 1 Retention, 2 scratch,
    instance: -1    # -1:shared (default) or private to instance 0..63 

  - memory: SRAM    # shared static external used for swap
    index: 1
    size: 8000      
    access: 0       
    speed: 0        
    type: 0         
    subblocks:      # the SRAM is made of smaller subblocks
      - subblock:
        index: 0
        name: sram1
        base: 0
        size: 1014
      - subblock:
        index: 1
        name: sram2
        base: 1024
        size: 1014
    instance: -1 

  - memory: RET     # simulates shared retention memory
    index: 2
    size: 80        
    access: 0       
    speed: 0        
    type: 1         
    instance: -1 

  - memory: private0
    index: 3
    size: 8000      
    speed: 2        
    instance: 0

  - memory: private1
    index: 4
    size: 80      
    instance: 1

#------------------------------------------
interpreter_instances:
  - instance: MAIN  # in charge of boot
    index: 0
    archID: armv7m
    procID: 0
    priority: 1
    trace_depth: 256
    trace_verbosity: 2
    memory_isolation: 1                 # MPU activated
        
    interfaces:
 
      #IO interfaces functions to the possible streams of this platform 
      #extern void io_data_sink      0
      #extern void io_data_in_0      1
      #extern void io_data_in_1      2
      #extern void io_data_out_0     3
      #extern void io_data_out_1     4
      #extern void io_sensor_in_0    5
      #extern void io_timer_0        9
      #extern void io_ui_in_0       11
      #extern void io_ui_out_0      15
      #extern void io_serial_in_0   19
      #extern void io_analog_in_0   21
      #extern void io_audio_in_0    23
      #extern void io_audio_out_0   26
      #extern void io_2d_in_0       30
    
      - interface:                      # io_data_sink[0]
        index: 0
        c_platform_index: 0
        name: io_data_sink
        direction: tx
        domain: general

            
      - interface:                      # io_data_in[0]
        path: 1
        index: 0
        c_platform_index: 1
        name: io_data_in
        direction: rx
        domain: general
        format:
          data_type:
            default: float32             
            values: [int16, float32]
          frame_length:
            type: int
            default: 4
            values: [1, 2, 3, 4, 8, 16, 32]
          sample_rate:
            type: float
            default: 16000
            values: [8000, 16000, 44100]
          nb_channels:
            type: int
            default: 1
            values: [1, 2, 4]        
            
      - interface:                      # io_data_in[1]
        path: 1
        index: 1
        c_platform_index: 2
